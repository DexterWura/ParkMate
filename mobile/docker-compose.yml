services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: openlot
      POSTGRES_USER: openlot
      POSTGRES_PASSWORD: openlot
    ports:
      - "5432:5432"
    volumes:
      - openlot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openlot -d openlot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/openlot
      DATABASE_USER: openlot
      DATABASE_PASSWORD: openlot
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  openlot_pgdata:
